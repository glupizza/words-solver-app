services:
  app:
    build: .
    image: words-solver-app:v2
    container_name: words-solver-v2
    restart: unless-stopped

    ports:
      - "127.0.0.1:8000:8000"

    env_file:
      - ${WORDER_ENV_FILE:-/opt/worder/worder.env}

    volumes:
      - ${WORDER_DATA_DIR:-/opt/worder/data}:/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      retries: 3
